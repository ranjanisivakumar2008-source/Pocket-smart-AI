<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Smart AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>🤖 Pocket Smart AI</h1>
        <p>Your simple AI-powered pocket assistant</p>

        <div class="chat-box" id="chatBox">
            <div class="bot">
                Hello! 👋 I'm Pocket Smart AI. How can I help you?
            </div>
        </div>

        <div class="input-area">
            <input
                type="text"
                id="userInput"
                placeholder="Ask something..."
            >
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
